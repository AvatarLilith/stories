<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #fff;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }

  .track {
    display: flex;
    align-items: center;
    width: 100vw;
    height: 100vh;
    overflow-x: scroll;
    overflow-y: hidden;
    padding: 0 40px;
    gap: 4px;
    scrollbar-width: none;
    -ms-overflow-style: none;
    cursor: grab;
  }

  .track:active { cursor: grabbing; }
  .track::-webkit-scrollbar { display: none; }

  .item {
    flex-shrink: 0;
    width: 80px;
    height: 120px;
    overflow: hidden;
    position: relative;
    border-radius: 2px;
    background: #f5f5f5;
  }

  .item:hover,
  .item.pressed {
    z-index: 10;
    overflow: visible;
  }

  .item:hover .media-wrap,
  .item.pressed .media-wrap {
    transform: scale(4);
    transform-origin: center center;
    z-index: 10;
  }

  .media-wrap {
    width: 100%;
    height: 100%;
    position: relative;
  }

  .media-wrap img,
  .media-wrap video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
</style>
</head>
<body>

<div class="track" id="track"></div>

<script>
// ── AUTO-GENERATED — do not edit manually ──────────────────
// Run generate.sh (Mac) or generate.bat (Windows) to update
const files = [
  // FILES_START
  // FILES_END
];
// ──────────────────────────────────────────────────────────

const track = document.getElementById('track');

function isVideo(name) {
  return /\.(mp4|mov|webm)$/i.test(name);
}

files.forEach(src => {
  const div = document.createElement('div');
  div.className = 'item';
  const wrap = document.createElement('div');
  wrap.className = 'media-wrap';

  if (isVideo(src)) {
    const v = document.createElement('video');
    v.src = src;
    v.muted = true;
    v.loop = true;
    v.playsInline = true;
    v.preload = 'metadata';
    wrap.appendChild(v);
    div.addEventListener('mouseenter', () => v.play());
    div.addEventListener('mouseleave', () => { v.pause(); v.currentTime = 0; });
  } else {
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    img.loading = 'lazy';
    wrap.appendChild(img);
  }

  // long press for mobile
  let pressTimer;
  div.addEventListener('touchstart', () => {
    pressTimer = setTimeout(() => div.classList.add('pressed'), 300);
  }, { passive: true });
  div.addEventListener('touchend', () => { clearTimeout(pressTimer); div.classList.remove('pressed'); });
  div.addEventListener('touchcancel', () => { clearTimeout(pressTimer); div.classList.remove('pressed'); });

  div.appendChild(wrap);
  track.appendChild(div);
});

// ── drag to scroll ────────────────────────────────────────
let isDown = false, startX, scrollLeft;
track.addEventListener('mousedown', e => {
  isDown = true;
  startX = e.pageX - track.offsetLeft;
  scrollLeft = track.scrollLeft;
});
track.addEventListener('mouseleave', () => isDown = false);
track.addEventListener('mouseup', () => isDown = false);
track.addEventListener('mousemove', e => {
  if (!isDown) return;
  e.preventDefault();
  track.scrollLeft = scrollLeft - (e.pageX - track.offsetLeft - startX) * 1.2;
});

track.addEventListener('wheel', e => {
  e.preventDefault();
  track.scrollLeft += e.deltaY + e.deltaX;
}, { passive: false });
</script>
</body>
</html>
