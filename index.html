// ──────────────────────────────────────────────────────────

const track = document.getElementById('track');

function isVideo(name) {
  return /\.(mp4|mov|webm)$/i.test(name);
}

files.forEach(src => {
  const div = document.createElement('div');
  div.className = 'item';
  const wrap = document.createElement('div');
  wrap.className = 'media-wrap';

  if (isVideo(src)) {
    const v = document.createElement('video');
    v.src = src;
    v.muted = true;
    v.loop = true;
    v.playsInline = true;
    v.preload = 'metadata';
    wrap.appendChild(v);
    div.addEventListener('mouseenter', () => v.play());
    div.addEventListener('mouseleave', () => { v.pause(); v.currentTime = 0; });
  } else {
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    img.loading = 'lazy';
    wrap.appendChild(img);
  }

  // long press for mobile
  let pressTimer;
  div.addEventListener('touchstart', () => {
    pressTimer = setTimeout(() => div.classList.add('pressed'), 300);
  }, { passive: true });
  div.addEventListener('touchend', () => { clearTimeout(pressTimer); div.classList.remove('pressed'); });
  div.addEventListener('touchcancel', () => { clearTimeout(pressTimer); div.classList.remove('pressed'); });

  div.appendChild(wrap);
  track.appendChild(div);
});

// ── drag to scroll ────────────────────────────────────────
let isDown = false, startX, scrollLeft;
track.addEventListener('mousedown', e => {
  isDown = true;
  startX = e.pageX - track.offsetLeft;
  scrollLeft = track.scrollLeft;
});
track.addEventListener('mouseleave', () => isDown = false);
track.addEventListener('mouseup', () => isDown = false);
track.addEventListener('mousemove', e => {
  if (!isDown) return;
  e.preventDefault();
  track.scrollLeft = scrollLeft - (e.pageX - track.offsetLeft - startX) * 1.2;
});

track.addEventListener('wheel', e => {
  e.preventDefault();
  track.scrollLeft += e.deltaY + e.deltaX;
}, { passive: false });
</script>
