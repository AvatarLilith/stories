<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  background:#fff;
  width:100%;
  height:100vh;
  overflow:hidden;
  font-family:'Archivo Narrow',Arial,sans-serif;
}

#switcher {
  position:fixed;
  top:16px;
  right:20px;
  display:flex;
  flex-direction:column;
  gap:6px;
  z-index:200;
  align-items:flex-end;
}

#switcher span {
  font-family:inherit;
  font-size:11px;
  color:#000;
  cursor:pointer;
}

#switcher span.active { color:blue; }

/* default */
#default-mode { display:none; width:100%; height:100vh; }
#default-mode.visible { display:block; }

/* blur */
#blur-mode { display:none; width:100%; height:100vh; }
#blur-mode.visible { display:block; }

.track {
  display:flex;
  align-items:center;
  width:100vw;
  height:100vh;
  overflow-x:scroll;
  overflow-y:hidden;
  padding:0 40px;
  gap:4px;
  scrollbar-width:none;
  cursor:grab;
}
.track:active { cursor:grabbing; }
.track::-webkit-scrollbar { display:none; }

.item { flex-shrink:0; width:80px; height:120px; overflow:hidden; position:relative; }
.item.has-effect:hover { z-index:10; overflow:visible; }
.item.has-effect:hover .media-wrap { transform:scale(2.5); transform-origin:center center; filter:blur(6px); }
.media-wrap { width:100%; height:100%; }
.media-wrap img, .media-wrap video { width:100%; height:100%; object-fit:cover; display:block; }

/* moon */
#moon-mode { display:none; width:100vw; height:100vh; position:relative; }
#moon-mode.visible { display:block; }
#moon-canvas { position:absolute; top:0; left:0; }
#moon-label {
  position:absolute;
  font-family:inherit;
  font-size:11px;
  color:#000;
  pointer-events:none;
  white-space:nowrap;
  transform:translateX(-50%);
  z-index:50;
}

/* cycle */
#cycle-mode { display:none; width:100vw; height:100vh; position:relative; }
#cycle-mode.visible { display:block; }
#cycle-label {
  position:fixed;
  font-family:inherit;
  font-size:11px;
  color:#000;
  pointer-events:none;
  white-space:nowrap;
  z-index:50;
  opacity:0;
  transition:opacity 0.1s;
  transform:translateX(-50%);
}
#cycle-track {
  display:flex;
  align-items:center;
  width:100vw;
  height:100vh;
  overflow-x:scroll;
  overflow-y:hidden;
  padding:0 40px;
  gap:4px;
  scrollbar-width:none;
  cursor:grab;
}
#cycle-track:active { cursor:grabbing; }
#cycle-track::-webkit-scrollbar { display:none; }
.citem { flex-shrink:0; width:80px; height:120px; position:relative; overflow:hidden; }
.citem:hover { z-index:10; overflow:visible; }
.citem:hover .cw { transform:scale(2.5); transform-origin:center center; filter:blur(6px); }
.cw { width:100%; height:100%; position:relative; }
.cw img { width:100%; height:100%; object-fit:cover; display:block; }
.ctint { position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity 0.15s; }
.citem:hover .ctint { opacity:1; }

/* water */
#water-mode {
  display:none;
  width:100vw;
  height:100vh;
  align-items:center;
  justify-content:center;
  font-family:inherit;
  font-size:11px;
  color:#000;
}
#water-mode.visible { display:flex; }
</style>
</head>
<body>

<div id="switcher">
  <span onclick="setMode('default')" class="active">default</span>
  <span onclick="setMode('blur')">blur</span>
  <span onclick="setMode('moon')">moon</span>
  <span onclick="setMode('cycle')">cycle</span>
  <span onclick="setMode('water')">water</span>
</div>

<div id="default-mode" class="visible">
  <div class="track" id="default-track"></div>
</div>

<div id="blur-mode">
  <div class="track" id="track"></div>
</div>

<div id="moon-mode">
  <canvas id="moon-canvas"></canvas>
  <div id="moon-label"></div>
</div>

<div id="cycle-mode">
  <div id="cycle-label"></div>
  <div id="cycle-track"></div>
</div>

<div id="water-mode">coming soon</div>

<script>
// ── AUTO-GENERATED — do not edit manually ──────────────────
// Run: python generate.py to update
const files = [
  // FILES_START
  // FILES_END
];
// ──────────────────────────────────────────────────────────

const modes = ['default','blur','moon','cycle','water'];

function setMode(m) {
  modes.forEach(n => document.getElementById(n+'-mode').classList.toggle('visible', n===m));
  document.querySelectorAll('#switcher span').forEach((s,i) => s.classList.toggle('active', modes[i]===m));
  if (m==='moon') initMoon();
  if (m==='cycle') initCycle();
}

function isVideo(name) { return /\.(mp4|mov|webm)$/i.test(name); }

function getYearMonth(src) {
  const m = src.match(/(\d{6})/);
  return m ? m[1] : null;
}

function moonPhase(yyyymm) {
  const year = parseInt(yyyymm.slice(0,4));
  const month = parseInt(yyyymm.slice(4,6));
  const date = new Date(year, month-1, 15);
  const known = new Date(2000, 0, 6);
  const diff = (date - known) / (1000*60*60*24);
  const cycle = 29.53058867;
  return ((diff % cycle) + cycle) % cycle / cycle;
}

// ── default mode ──────────────────────────────────────────
const defaultTrack = document.getElementById('default-track');

files.forEach(src => {
  const div = document.createElement('div');
  div.className = 'item';
  const wrap = document.createElement('div');
  wrap.className = 'media-wrap';
  if (isVideo(src)) {
    const v = document.createElement('video');
    v.src=src; v.muted=true; v.loop=true; v.playsInline=true; v.preload='metadata';
    wrap.appendChild(v);
    div.addEventListener('mouseenter', ()=>v.play());
    div.addEventListener('mouseleave', ()=>{ v.pause(); v.currentTime=0; });
  } else {
    const img = document.createElement('img');
    img.src=src; img.alt=''; img.loading='lazy';
    wrap.appendChild(img);
  }
  div.appendChild(wrap);
  defaultTrack.appendChild(div);
});

let isDd=false, startXd, scrollLeftd;
defaultTrack.addEventListener('mousedown', e=>{ isDd=true; startXd=e.pageX-defaultTrack.offsetLeft; scrollLeftd=defaultTrack.scrollLeft; });
defaultTrack.addEventListener('mouseleave', ()=>isDd=false);
defaultTrack.addEventListener('mouseup', ()=>isDd=false);
defaultTrack.addEventListener('mousemove', e=>{ if(!isDd)return; e.preventDefault(); defaultTrack.scrollLeft=scrollLeftd-(e.pageX-defaultTrack.offsetLeft-startXd)*1.2; });
defaultTrack.addEventListener('wheel', e=>{ e.preventDefault(); defaultTrack.scrollLeft+=e.deltaY+e.deltaX; }, {passive:false});

// ── blur mode ─────────────────────────────────────────────
const track = document.getElementById('track');
const isMobile = window.matchMedia('(pointer: coarse)').matches;

files.forEach(src => {
  const div = document.createElement('div');
  div.className = 'item has-effect';
  const wrap = document.createElement('div');
  wrap.className = 'media-wrap';
  if (isVideo(src)) {
    const v = document.createElement('video');
    v.src=src; v.muted=true; v.loop=true; v.playsInline=true; v.preload='metadata';
    wrap.appendChild(v);
    div.addEventListener('mouseenter', ()=>v.play());
    div.addEventListener('mouseleave', ()=>{ v.pause(); v.currentTime=0; });
  } else {
    const img = document.createElement('img');
    img.src=src; img.alt=''; img.loading='lazy';
    wrap.appendChild(img);
  }
  div.appendChild(wrap);
  track.appendChild(div);
});

if (isMobile) {
  const updateActive = () => {
    const center = track.scrollLeft + window.innerWidth/2;
    const items = track.querySelectorAll('.item');
    let closest=null, closestDist=Infinity;
    items.forEach(item => {
      const dist = Math.abs(item.offsetLeft + item.offsetWidth/2 - center);
      if (dist < closestDist) { closestDist=dist; closest=item; }
    });
    items.forEach(item => item.classList.remove('active'));
    if (closest) closest.classList.add('active');
  };
  track.addEventListener('scroll', updateActive, {passive:true});
  updateActive();
}

let isDown=false, startX, scrollLeft;
track.addEventListener('mousedown', e=>{ isDown=true; startX=e.pageX-track.offsetLeft; scrollLeft=track.scrollLeft; });
track.addEventListener('mouseleave', ()=>isDown=false);
track.addEventListener('mouseup', ()=>isDown=false);
track.addEventListener('mousemove', e=>{ if(!isDown)return; e.preventDefault(); track.scrollLeft=scrollLeft-(e.pageX-track.offsetLeft-startX)*1.2; });
track.addEventListener('wheel', e=>{ e.preventDefault(); track.scrollLeft+=e.deltaY+e.deltaX; }, {passive:false});

// ── moon mode ─────────────────────────────────────────────
const phaseNames = ['new moon','waxing crescent','first quarter','waxing gibbous','full moon','waning gibbous','last quarter','waning crescent'];
let moonInited = false, moonRotation = 0;

function initMoon() {
  if (moonInited) return;
  moonInited = true;

  const moonImages = files.map(src => {
    const ym = getYearMonth(src);
    const phase = ym ? moonPhase(ym) : 0;
    const img = new Image();
    img.src = src;
    return { img, phase };
  });

  const canvas = document.getElementById('moon-canvas');
  const label = document.getElementById('moon-label');
  const count = moonImages.length;
  const arcR=1100, tW=48, tH=72, cR=88, arcSpan=Math.PI*0.65;
  const baseAngles = Array.from({length:count}, (_,i) => -Math.PI/2 + ((i/(count-1))*2-1)*(arcSpan/2));
  let W, H;

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width=W; canvas.height=H;
  }

  function drawMoonOverlay(ctx, cx, cy, r, phase) {
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();
    ctx.fillStyle='rgba(255,255,255,0.88)';
    if (phase<0.5) { const s=Math.abs(1-phase*4); ctx.beginPath(); ctx.arc(cx,cy,r,Math.PI/2,-Math.PI/2,true); ctx.ellipse(cx,cy,r*s,r,0,-Math.PI/2,Math.PI/2,true); ctx.fill(); }
    else { const s=Math.abs((phase-0.5)*4-1); ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI/2,Math.PI/2,true); ctx.ellipse(cx,cy,r*s,r,0,Math.PI/2,-Math.PI/2,true); ctx.fill(); }
    ctx.restore();
  }

  function draw() {
    const ctx = canvas.getContext('2d'); ctx.clearRect(0,0,W,H);
    const arcCX=W/2, arcCY=H+arcR-H*0.55, magX=W/2, magY=arcCY-arcR;

    for (let i=0; i<count; i++) {
      const angle=baseAngles[i]+moonRotation, x=arcCX+arcR*Math.cos(angle), y=arcCY+arcR*Math.sin(angle);
      if (x<-150||x>W+150) continue;
      ctx.save(); ctx.translate(x,y); ctx.rotate(angle+Math.PI/2);
      ctx.beginPath(); ctx.rect(-tW/2,-tH/2,tW,tH); ctx.clip();
      if (moonImages[i].img.complete) ctx.drawImage(moonImages[i].img,-tW/2,-tH/2,tW,tH);
      else { ctx.fillStyle='#f0f0f0'; ctx.fillRect(-tW/2,-tH/2,tW,tH); }
      ctx.restore();
    }

    let ci=0, minDist=Infinity;
    for (let i=0; i<count; i++) {
      const angle=baseAngles[i]+moonRotation, x=arcCX+arcR*Math.cos(angle), y=arcCY+arcR*Math.sin(angle);
      const d=Math.hypot(x-magX,y-magY);
      if (d<minDist) { minDist=d; ci=i; }
    }

    const ca=baseAngles[ci]+moonRotation, cx2=arcCX+arcR*Math.cos(ca), cy2=arcCY+arcR*Math.sin(ca);
    ctx.save(); ctx.translate(cx2,cy2); ctx.rotate(ca+Math.PI/2);
    ctx.beginPath(); ctx.arc(0,0,cR,0,Math.PI*2); ctx.clip();
    if (moonImages[ci].img.complete) ctx.drawImage(moonImages[ci].img,-cR,-cR,cR*2,cR*2);
    else { ctx.fillStyle='#f0f0f0'; ctx.fillRect(-cR,-cR,cR*2,cR*2); }
    ctx.restore();
    drawMoonOverlay(ctx, cx2, cy2, cR, moonImages[ci].phase);

    label.textContent = phaseNames[Math.floor(moonImages[ci].phase*8)];
    label.style.left = cx2+'px';
    label.style.top = (cy2-cR-18)+'px';
  }

  resize(); draw();
  window.addEventListener('resize', ()=>{ resize(); draw(); });
  moonImages.forEach(m => m.img.onload = draw);

  canvas.addEventListener('wheel', e=>{ e.preventDefault(); moonRotation+=(e.deltaY+e.deltaX)*0.0008; draw(); }, {passive:false});
  let tx=0;
  canvas.addEventListener('touchstart', e=>{ tx=e.touches[0].clientX; }, {passive:true});
  canvas.addEventListener('touchmove', e=>{ const dx=e.touches[0].clientX-tx; moonRotation+=dx*0.002; tx=e.touches[0].clientX; draw(); }, {passive:true});
}

// ── cycle mode ────────────────────────────────────────────
const cycleColors = {
  menstrual:  'rgba(200,40,40,0.6)',
  follicular: 'rgba(220,180,40,0.55)',
  ovulation:  'rgba(210,80,60,0.6)',
  luteal:     'rgba(100,40,160,0.55)',
};
let cycleInited = false, cycleData = {};

async function initCycle() {
  if (cycleInited) return;
  cycleInited = true;

  try {
    const res = await fetch('cycle.csv');
    const text = await res.text();
    text.split('\n').slice(1).forEach(line => {
      const [date, phase] = line.trim().split(',');
      if (date && phase) cycleData[date] = phase.trim();
    });
  } catch(e) { console.warn('cycle.csv not found'); }

  const cycleTrack = document.getElementById('cycle-track');
  const cycleLabel = document.getElementById('cycle-label');

  files.forEach(src => {
    const ym = getYearMonth(src);
    const dateKey = ym ? `${ym.slice(0,4)}-${ym.slice(4,6)}-15` : null;
    const phase = (dateKey && cycleData[dateKey]) || 'follicular';
    const color = cycleColors[phase];

    const div = document.createElement('div');
    div.className = 'citem';
    const wrap = document.createElement('div');
    wrap.className = 'cw';
    const img = document.createElement('img');
    img.src=src; img.alt=''; img.loading='lazy';
    wrap.appendChild(img);
    const tint = document.createElement('div');
    tint.className='ctint'; tint.style.background=color;
    wrap.appendChild(tint);
    div.appendChild(wrap);

    div.addEventListener('mouseenter', () => {
      const rect = div.getBoundingClientRect();
      cycleLabel.textContent = phase;
      cycleLabel.style.left = (rect.left + rect.width/2)+'px';
      cycleLabel.style.top = (rect.top - rect.height*0.75 - 18)+'px';
      cycleLabel.style.opacity = '1';
    });
    div.addEventListener('mouseleave', () => cycleLabel.style.opacity='0');
    cycleTrack.appendChild(div);
  });

  let isDown2=false, startX2, scrollLeft2;
  cycleTrack.addEventListener('mousedown', e=>{ isDown2=true; startX2=e.pageX-cycleTrack.offsetLeft; scrollLeft2=cycleTrack.scrollLeft; });
  cycleTrack.addEventListener('mouseleave', ()=>isDown2=false);
  cycleTrack.addEventListener('mouseup', ()=>isDown2=false);
  cycleTrack.addEventListener('mousemove', e=>{ if(!isDown2)return; e.preventDefault(); cycleTrack.scrollLeft=scrollLeft2-(e.pageX-cycleTrack.offsetLeft-startX2)*1.2; });
  cycleTrack.addEventListener('wheel', e=>{ e.preventDefault(); cycleTrack.scrollLeft+=e.deltaY+e.deltaX; }, {passive:false});
}
</script>
</body>
</html>
